# GoReleaser config for agent-cli.
# Docs: https://goreleaser.com
#
# Usage:
#   goreleaser release --clean           # full release (run in CI on a tag)
#   goreleaser release --snapshot --clean  # local test without publishing

version: 2

project_name: agent-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: agent
    binary: agent
    main: ./cmd/agent
    ldflags:
      - -s -w -X github.com/xautjzd/agent-cli/internal/version.Version={{.Version}}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64

archives:
  - ids:
      - agent
    # tar.gz for Unix, zip for Windows
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  # Group commits by conventional-commit type for readable release notes.
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([^)]*\))?:.*$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\([^)]*\))?:.*$'
      order: 1
    - title: "Documentation"
      regexp: '^.*?docs(\([^)]*\))?:.*$'
      order: 2
    - title: "Other"
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: xautjzd
    name: agent-cli
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
